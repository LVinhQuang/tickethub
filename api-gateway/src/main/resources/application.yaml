server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/**

            - id: catalog-service-public
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/events/**

            - id: catalog-service-admin
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/admin/events/**
              filters:
                - JwtValidationFilter

            - id: booking-service
              uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/bookings/**
              filters:
                - JwtValidationFilter

            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/inventory/**
              filters:
                - JwtValidationFilter

app:
  jwt:
    secret: "this-is-a-demo-secret-key-for-tickethub-auth-service"